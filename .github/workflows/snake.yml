name: Generate Contribution Snake

on:
  schedule:
    # 每天 UTC 0 点运行（北京时间上午8点）
    - cron: "0 0 * * *"

  # 手动运行
  workflow_dispatch:

permissions:
  contents: write


jobs:
  generate:

    runs-on: ubuntu-latest

    steps:

      # 生成 GitHub Contribution Snake
      - name: Generate Snake Animation
        uses: Platane/snk@v3

        with:
          github_user_name: IHXU

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff69b4&color_dots=%23ffd6e7,%23ffb6c1,%23ff8fab,%23ff69b4,%23ff1493
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff69b4


      # 推送到 output 分支
      - name: Deploy Snake Animation

        uses: crazy-max/ghaction-github-pages@v4

        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
